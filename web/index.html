<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Appstone - a web and mobile application for capstone guidance at the College of Computer Studies, Dominican College of Tarlac.">

  <!--
    The Flutter engine injects an identical viewport tag while it boots, so the
    running app is laid out correctly on phones either way. It is declared here
    as well because the engine's copy only exists once main.dart.js has loaded,
    which on this bundle takes several seconds on a slow connection - and until
    then a mobile browser would lay the page out at its default ~980px width.
    Declaring it up front means the markup below is scaled correctly from the
    very first paint.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

  <!-- Tints the browser chrome to the Appstone maroon on mobile. -->
  <meta name="theme-color" content="#8B1A1A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Appstone">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Appstone</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
