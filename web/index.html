<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Appstone - a web and mobile application for capstone guidance at the College of Computer Studies, Dominican College of Tarlac.">

  <!--
    The Flutter engine injects an identical viewport tag while it boots, so the
    running app is laid out correctly on phones either way. It is declared here
    as well because the engine's copy only exists once main.dart.js has loaded,
    which on this bundle takes several seconds on a slow connection - and until
    then a mobile browser would lay the page out at its default ~980px width.
    Declaring it up front means the markup below is scaled correctly from the
    very first paint.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

  <!-- Tints the browser chrome to the Appstone maroon on mobile. -->
  <meta name="theme-color" content="#8B1A1A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Appstone">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Appstone</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Boot splash.

      This bundle is ~26 MB, so on campus wifi the browser would otherwise show
      a blank white page for several seconds before Flutter paints anything.
      The splash is plain HTML/CSS so it appears on the very first paint, long
      before main.dart.js has parsed.

      It is drawn in the brand maroon in both colour schemes on purpose: it is
      a fixed brand surface, and matching it to `theme_color` means the browser
      chrome and the page agree while the app loads.
    */
    html, body {
      margin: 0;
      padding: 0;
      /* Maroon only while the splash is up. Left in place it would show
         through wherever Flutter's canvas does not paint - most visibly as a
         maroon flash when the page is over-scrolled on a phone - so the
         dismiss handler clears it once the app has painted. */
      background-color: #8B1A1A;
    }

    html.app-booted, html.app-booted body {
      background-color: transparent;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #8B1A1A;
      /* Safe areas so the mark stays centred on notched phones. */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      opacity: 1;
      transition: opacity 320ms ease-out;
    }

    /* Set once Flutter has painted its first frame. */
    #app-splash.is-gone {
      opacity: 0;
      pointer-events: none;
    }

    #app-splash svg {
      width: 88px;
      height: 88px;
    }

    #app-splash-name {
      font-family: "Plus Jakarta Sans", "Segoe UI", Roboto, "Helvetica Neue",
                   Arial, sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #FFFFFF;
    }

    #app-splash-bar {
      width: 128px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      overflow: hidden;
    }

    #app-splash-bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      animation: app-splash-slide 1.15s ease-in-out infinite;
    }

    @keyframes app-splash-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }

    /* Readers who ask for less motion get a steady bar instead of a moving one. */
    @media (prefers-reduced-motion: reduce) {
      #app-splash-bar span {
        animation: none;
        width: 100%;
        opacity: 0.6;
      }
      #app-splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="app-splash">
    <!--
      The Appstone mark, drawn from the same 512x512 geometry as
      assets/branding/appstone_logo.svg and the in-app CustomPainter, so the
      splash and the app show an identical logo. No tile here - the splash
      background already supplies the maroon.
    -->
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="none" stroke="#FFFFFF" stroke-width="44"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M236 132 H276 L360 388" />
        <path d="M236 132 L152 388" />
        <path d="M190 300 H322" />
      </g>
    </svg>
    <div id="app-splash-name">Appstone</div>
    <div id="app-splash-bar"><span></span></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    (function () {
      var splash = document.getElementById('app-splash');
      if (!splash) return;

      var removed = false;
      function dismiss() {
        if (removed) return;
        removed = true;
        splash.classList.add('is-gone');
        // Hand the page background back to Flutter.
        document.documentElement.classList.add('app-booted');
        // Wait out the fade before detaching, so the app is not revealed by a
        // hard cut.
        window.setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 400);
      }

      // Flutter fires this on the window once it has painted its first frame.
      window.addEventListener('flutter-first-frame', dismiss);

      // Failsafe: if that event never arrives (an engine error, a blocked
      // asset), the splash must not trap the user on a maroon screen forever.
      window.setTimeout(dismiss, 20000);
    })();
  </script>
</body>
</html>
